[project]
name = "comicfuryscraper"
version = "1.1.0"
description = "A simple terminal CLI app to download ComicFury comics"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "enzomtpYT", email = "contact@enzomtp.party"}]
dependencies = [
    "requests",
    "beautifulsoup4",
    "mechanicalsoup"
]
urls = {repository = "https://github.com/enzomtpYT/ComicFury-AutoCBZ"}
keywords = [
    "python",
    "scraper",
    "downloader",
    "download",
    "images",
    "comic",
    "comics",
    "batch", 
    "comic-downloader",
    "scrape",
    "bulk",
    "cbz",
    "comic-scraper",
    "comicfury",
    "comicpress"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
    "vulture>=2.16",
]

[project.scripts]
comicfuryscraper = "comicfuryscraper.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["comicfuryscraper"]
package-dir = {"comicfuryscraper" = "src"}

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.vulture]
min_confidence = 80
paths = ["src/"]


