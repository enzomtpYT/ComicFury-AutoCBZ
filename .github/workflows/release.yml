name: Build and Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary_name: comicfuryscraper-linux-x86_64
            output_name: comicfuryscraper-linux-x86_64
          - os: macos-13
            target: macos-intel
            binary_name: comicfuryscraper-macos-x86_64
            output_name: comicfuryscraper-macos-x86_64
          - os: macos-latest
            target: macos-arm64
            binary_name: comicfuryscraper-macos-arm64
            output_name: comicfuryscraper-macos-arm64
          - os: windows-latest
            target: windows-x64
            binary_name: comicfuryscraper.exe
            output_name: comicfuryscraper.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          uv run --with pyinstaller pyinstaller --onefile --paths src --name "${{ matrix.binary_name }}" src/cli.py

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.output_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

